name: Telegram Coin Alert

permissions:
  contents: write

concurrency:
  group: telegram-signal-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # KST 01:10, 09:10, 13:10, 17:10, 21:10
    # UTC 16:10, 00:10, 04:10, 08:10, 12:10
    - cron: "10 0,4,8,12,16 * * *"

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Show environment
        run: |
          echo "===== pwd ====="
          pwd
          echo "===== files ====="
          ls -la
          echo "===== git status ====="
          git status
          echo "===== python version ====="
          python3 --version
          echo "===== pip version ====="
          python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas numpy requests

      - name: Ensure active_signals.json exists
        run: |
          if [ ! -f active_signals.json ]; then
            echo '{"active":[],"closed":[]}' > active_signals.json
            echo "Created active_signals.json"
          else
            echo "active_signals.json already exists"
          fi

          echo "===== active_signals.json before bot ====="
          cat active_signals.json

      - name: Run Telegram alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_INTERVAL: "minute240"
          ALERT_CANDLE_COUNT: "200"
          REQUEST_DELAY: "0.08"
          MAX_ALERT_COUNT: "10"
          SEND_EMPTY_ALERT: "true"

          ENABLE_SIGNAL_TRACKING: "true"
          SIGNAL_STATE_FILE: "active_signals.json"

          TAKE_PROFIT_RATE: "0.05"
          STOP_LOSS_RATE: "0.04"
          MAX_HOLD_HOURS: "48"
          SIGNAL_COOLDOWN_HOURS: "12"

          MIN_4H_TRADE_VALUE: "150000000"
          MIN_CANDLE_CHANGE: "0.7"
        run: |
          python3 alert_bot.py

      - name: Show active_signals.json after bot
        if: always()
        run: |
          echo "===== active_signals.json after bot ====="
          if [ -f active_signals.json ]; then
            cat active_signals.json
          else
            echo "active_signals.json not found"
          fi

      - name: Commit signal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== git status before commit ====="
          git status

          if [ ! -f active_signals.json ]; then
            echo "active_signals.json not found. Nothing to commit."
            exit 0
          fi

          git add active_signals.json

          if git diff --cached --quiet; then
            echo "No active_signals.json changes to commit."
            exit 0
          fi

          echo "===== commit active_signals.json ====="
          git commit -m "update active signals"

          echo "===== push try 1 ====="
          if git push origin main; then
            echo "Push success."
            exit 0
          fi

          echo "Push failed. Retry with pull --rebase."

          git pull --rebase origin main || {
            echo "Pull rebase failed."
            git rebase --abort || true
            exit 1
          }

          echo "===== push try 2 ====="
          git push origin main
