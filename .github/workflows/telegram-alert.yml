name: Telegram Coin Alert

permissions:
  contents: write

concurrency:
  group: telegram-signal-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # KST 01:10, 05:10, 09:10, 13:10, 17:10, 21:10
    # GitHub Actions cron is UTC
    - cron: "10 0,4,8,12,16,20 * * *"

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Show environment
        run: |
          echo "===== Current directory ====="
          pwd
          echo "===== Files ====="
          ls -la
          echo "===== Python ====="
          python3 --version
          python3 -m pip --version
          echo "===== Git status ====="
          git status

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas numpy requests

      - name: Ensure active_signals.json exists
        run: |
          if [ ! -f active_signals.json ]; then
            echo '{"active":[],"closed":[]}' > active_signals.json
          fi
          echo "===== active_signals.json before bot ====="
          cat active_signals.json

      - name: Check Python syntax
        run: |
          python3 -m py_compile alert_bot.py
          echo "alert_bot.py syntax OK"

      - name: Run Telegram alert bot
        env:
          RUN_MODE: "full"

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_INTERVAL: "minute240"
          ALERT_CANDLE_COUNT: "200"
          REQUEST_DELAY: "0.08"
          MAX_ALERT_COUNT: "10"
          SEND_EMPTY_ALERT: "true"

          ENABLE_SIGNAL_TRACKING: "true"
          SIGNAL_STATE_FILE: "active_signals.json"

          TAKE_PROFIT_RATE: "0.05"
          STOP_LOSS_RATE: "0.04"
          MAX_HOLD_HOURS: "48"
          SIGNAL_COOLDOWN_HOURS: "12"

          MIN_4H_TRADE_VALUE: "150000000"
          MIN_CANDLE_CHANGE: "0.7"

          ENABLE_LIVE_PRICE_CHECK: "true"
          ENTRY_OK_MAX_GAP: "1.0"
          ENTRY_CAUTION_MAX_GAP: "2.0"
          ENTRY_CHASE_MAX_GAP: "3.0"

          TRACK_PROFIT_NOTICE_1: "0.02"
          TRACK_PROFIT_NOTICE_2: "0.03"
          TRACK_NEAR_TP_RATE: "0.015"
          TRACK_NEAR_SL_RATE: "0.015"
          TRACK_DRAWDOWN_FROM_HIGH: "0.02"
        run: python3 alert_bot.py

      - name: Show active_signals.json after bot
        if: always()
        run: |
          echo "===== active_signals.json after bot ====="
          cat active_signals.json || echo "active_signals.json not found"

      - name: Commit signal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f active_signals.json ]; then
            echo "active_signals.json not found. Skip commit."
            exit 0
          fi

          git add active_signals.json

          if git diff --cached --quiet; then
            echo "No active_signals.json changes to commit."
            exit 0
          fi

          git commit -m "update active signals"

          if git push origin main; then
            echo "Push success."
            exit 0
          fi

          echo "Push failed. Try pull --rebase then push again."
          git pull --rebase origin main || { git rebase --abort || true; exit 1; }
          git push origin main
