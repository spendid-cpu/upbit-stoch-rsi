name: Telegram Coin Alert

permissions:
  contents: write

concurrency:
  group: telegram-signal-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # KST 01:10, 09:10, 13:10, 17:10, 21:10
    # UTC 16:10, 00:10, 04:10, 08:10, 12:10
    - cron: "10 0,4,8,12,16 * * *"

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Show files before run
        run: |
          echo "===== Current directory ====="
          pwd
          echo "===== Files ====="
          ls -la
          echo "===== Git branch ====="
          git branch --show-current
          echo "===== Git status ====="
          git status

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Ensure active_signals.json exists
        run: |
          if [ ! -f active_signals.json ]; then
            echo '{"active":[],"closed":[]}' > active_signals.json
            echo "Created active_signals.json"
          else
            echo "active_signals.json already exists"
          fi
          echo "===== active_signals.json before bot ====="
          cat active_signals.json

      - name: Run Telegram alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_INTERVAL: "minute240"
          ALERT_CANDLE_COUNT: "200"
          REQUEST_DELAY: "0.08"
          MAX_ALERT_COUNT: "10"
          SEND_EMPTY_ALERT: "true"

          ENABLE_SIGNAL_TRACKING: "true"
          SIGNAL_STATE_FILE: "active_signals.json"

          TAKE_PROFIT_RATE: "0.05"
          STOP_LOSS_RATE: "0.04"
          MAX_HOLD_HOURS: "48"
          SIGNAL_COOLDOWN_HOURS: "12"

          MIN_4H_TRADE_VALUE: "150000000"
          MIN_CANDLE_CHANGE: "0.7"
        run: python alert_bot.py

      - name: Show active_signals.json after bot
        run: |
          echo "===== active_signals.json after bot ====="
          if [ -f active_signals.json ]; then
            cat active_signals.json
          else
            echo "active_signals.json not found"
          fi

      - name: Commit signal state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "===== Git status before add ====="
          git status

          if [ -f active_signals.json ]; then
            git add active_signals.json

            echo "===== Git diff cached ====="
            git diff --cached -- active_signals.json || true

            if git diff --cached --quiet; then
              echo "No active_signals.json changes to commit."
            else
              git commit -m "update active signals"

              echo "===== Pull latest before push ====="
              git pull --rebase origin main

              echo "===== Push active_signals.json ====="
              git push origin main
            fi
          else
            echo "active_signals.json not found. Nothing to commit."
          fi
