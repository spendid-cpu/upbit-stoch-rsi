name: Telegram Coin Alert

permissions:
  contents: write

concurrency:
  group: telegram-signal-state
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    # KST 01:10, 09:10, 13:10, 17:10, 21:10
    # UTC 16:10, 00:10, 04:10, 08:10, 12:10
    - cron: "10 0,4,8,12,16 * * *"

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Show environment
        run: |
          echo "===== PWD ====="
          pwd

          echo "===== FILES ====="
          ls -la

          echo "===== GIT STATUS ====="
          git status

          echo "===== PYTHON ====="
          python3 --version

          echo "===== PIP ====="
          python3 -m pip --version

      - name: Install dependencies
        run: |
          set -x
          python3 -m pip install --upgrade pip
          python3 -m pip install pandas numpy requests

      - name: Check Python syntax
        run: |
          set -x
          python3 -m py_compile alert_bot.py
          echo "alert_bot.py syntax OK"

      - name: Ensure active_signals.json exists
        run: |
          set -x
          if [ ! -f active_signals.json ]; then
            echo '{"active":[],"closed":[]}' > active_signals.json
            echo "Created active_signals.json"
          else
            echo "active_signals.json already exists"
          fi

          echo "===== active_signals.json before bot ====="
          cat active_signals.json

      - name: Run Telegram alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          ALERT_INTERVAL: "minute240"
          ALERT_CANDLE_COUNT: "200"
          REQUEST_DELAY: "0.08"
          MAX_ALERT_COUNT: "10"
          SEND_EMPTY_ALERT: "true"

          ENABLE_SIGNAL_TRACKING: "true"
          SIGNAL_STATE_FILE: "active_signals.json"

          TAKE_PROFIT_RATE: "0.05"
          STOP_LOSS_RATE: "0.04"
          MAX_HOLD_HOURS: "48"
          SIGNAL_COOLDOWN_HOURS: "12"

          MIN_4H_TRADE_VALUE: "150000000"
          MIN_CANDLE_CHANGE: "0.7"
        run: |
          set -x
          python3 alert_bot.py

      - name: Show active_signals.json after bot
        if: always()
        run: |
          echo "===== active_signals.json after bot ====="
          if [ -f active_signals.json ]; then
            cat active_signals.json
          else
            echo "active_signals.json not found"
          fi

      - name: Commit signal state
        if: always()
        continue-on-error: true
        run: |
          set -x

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "===== GIT STATUS BEFORE COMMIT ====="
          git status

          if [ ! -f active_signals.json ]; then
            echo "active_signals.json not found. Nothing to commit."
            exit 0
          fi

          git add active_signals.json

          echo "===== CACHED DIFF ====="
          git diff --cached -- active_signals.json || true

          if git diff --cached --quiet; then
            echo "No active_signals.json changes to commit."
            exit 0
          fi

          git commit -m "update active signals"

          echo "===== PULL REBASE ====="
          git pull --rebase origin main || true

          echo "===== PUSH ====="
          git push origin main || true

          echo "Commit step finished."
